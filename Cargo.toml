[package]
name = "kuterm"
version = "0.0.14"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "highly configurable, gpu accelerated terminal"
repository = "https://github.com/roworu/kuterm"
authors = ["roworu"]
publish = false

[package.metadata.deb]
section = "utils"
assets = [
    ["target/release/kuterm", "usr/bin/", "755"],
    ["assets/kuterm.desktop", "usr/share/applications/", "644"],
    ["assets/logo/icon_256.png", "usr/share/icons/hicolor/256x256/apps/kuterm.png", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/kuterm", dest = "/usr/bin/kuterm", mode = "755" },
    { source = "assets/kuterm.desktop", dest = "/usr/share/applications/kuterm.desktop", mode = "644" },
    { source = "assets/logo/icon_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/kuterm.png", mode = "644" },
]

[dependencies]
# zed with one commit on top (vulkan without the gl probe, kuterm-vulkan-first branch) until
# it is upstream, rebase it on a bump
gpui = { git = "https://github.com/roworu/zed", rev = "f66d64d287d16beea9a29ce19d8b50b073ea4a9d" }
gpui_platform = { git = "https://github.com/roworu/zed", rev = "f66d64d287d16beea9a29ce19d8b50b073ea4a9d", features = ["wayland", "x11", "font-kit"] }
alacritty_terminal = { git = "https://github.com/zed-industries/alacritty", rev = "4c129667ce56611becdc82de6e28218c80e2e88f" }
anyhow = "1"
# the window icon is a png
image = { version = "0.25", default-features = false, features = ["png"] }
futures = "0.3"
# big completion specs are bundled gzipped, already in the tree through gpui
flate2 = "1"
# command inputs keep the order they are written in, already in the tree through serde_json
indexmap = { version = "2", features = ["serde"] }
# finds escapes in pty output, already in the tree through alacritty
memchr = "2"
# reloads config files when they change, without polling them
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order"] }
# question patterns of waiting programs, already in the tree through gpui
regex = "1"
# command values are quoted for the shell with this, already in the tree through gpui
shlex = "1"
skrifa = "0.48"
# cells a completion takes, wide chars take two, already in the tree through alacritty
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
# alacritty's pty traits take its poller, the pty is wrapped to scan its output
polling = "3"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# reads the color scheme before the first frame, gpui learns it only later
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }

[target.'cfg(target_os = "linux")'.dependencies]
# process sampler reads clock ticks and page size
libc = "0.2"
# tear off finds the x11 window under the pointer, desktop notifications go over dbus, all
# already in the tree through gpui and ashpd
raw-window-handle = "0.6"
x11rb = "0.14"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
gpui = { git = "https://github.com/roworu/zed", rev = "f66d64d287d16beea9a29ce19d8b50b073ea4a9d", features = ["test-support"] }

[profile.dev]
# full debuginfo makes ~900 MB binaries, linking them dominates rebuilds
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
