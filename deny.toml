[graph]
all-features = true

[advisories]
yanked = "deny"
# unmaintained crates only come in through gpui, which we cannot swap out
unmaintained = "workspace"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
]

[bans]
multiple-versions = "allow"

# gpui and alacritty pull git deps from zed's forks, nothing else may
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/proptest-rs/proptest", "https://github.com/roworu/zed"]

[sources.allow-org]
github = ["zed-industries"]
