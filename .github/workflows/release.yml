name: Release

on:
  pull_request:
    types: [ closed ]
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RELEASE_REF: ${{ github.event.pull_request.head.ref }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:

    # only publish after a release branch is merged into main, not when it is opened
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/v')

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Check branch version matches Cargo.toml
      run: |
        branch_version="${RELEASE_REF#release/v}"
        package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
        if [ "$branch_version" != "$package_version" ]; then
          echo "::error::branch $RELEASE_REF has version $branch_version, but Cargo.toml has $package_version"
          exit 1
        fi

    - name: Check release and tag do not exist yet
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${RELEASE_REF#release/}"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
          echo "::error::release $tag already exists, delete it before releasing"
          exit 1
        fi
        if git ls-remote --tags origin "refs/tags/$tag" | grep -q .; then
          echo "::error::tag $tag already exists, delete it before releasing"
          exit 1
        fi

  build:

    needs: check

    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, target: x86_64-unknown-linux-gnu, name: x86_64-linux }
          - { os: macos-latest, target: aarch64-apple-darwin, name: aarch64-macos }
          - { os: macos-latest, target: x86_64-apple-darwin, name: x86_64-macos }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: x86_64-windows }

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@v2

    - name: Install dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake pkg-config \
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libasound2-dev libssl-dev libzstd-dev

    - name: Add target
      run: rustup target add ${{ matrix.target }}

    - name: Build
      run: cargo build --release --verbose --target ${{ matrix.target }}

    - name: Package
      run: |
        name=kuterm-${RELEASE_REF#release/}-${{ matrix.name }}
        mkdir "$name"
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp target/${{ matrix.target }}/release/kuterm.exe "$name/"
          7z a "$name.zip" "$name"
        elif [ "$RUNNER_OS" = "Linux" ]; then
          strip target/${{ matrix.target }}/release/kuterm
          cp target/${{ matrix.target }}/release/kuterm "$name/"
          tar -czf "$name.tar.gz" "$name"
        fi

    - name: Package app, dmg
      if: runner.os == 'macOS'
      run: |
        name=kuterm-${RELEASE_REF#release/}-${{ matrix.name }}
        version=${RELEASE_REF#release/v}
        app=dmg/kuterm.app
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
        strip target/${{ matrix.target }}/release/kuterm
        cp target/${{ matrix.target }}/release/kuterm "$app/Contents/MacOS/"
        sed "s/VERSION/$version/g" assets/macos/Info.plist > "$app/Contents/Info.plist"

        mkdir kuterm.iconset
        for size in 16 32 128 256; do
          sips -z $size $size assets/logo/logo.png --out kuterm.iconset/icon_${size}x${size}.png > /dev/null
          sips -z $((size * 2)) $((size * 2)) assets/logo/logo.png --out kuterm.iconset/icon_${size}x${size}@2x.png > /dev/null
        done
        iconutil -c icns kuterm.iconset -o "$app/Contents/Resources/kuterm.icns"

        # strip breaks the linker's signature and apple silicon kills unsigned apps, so sign ad-hoc.
        # it needs no apple account, macos still asks to allow the app in system settings once
        codesign --force --sign - "$app"

        # the applications link lets the user drag the app into it
        ln -s /Applications dmg/Applications
        hdiutil create -volname kuterm -srcfolder dmg -ov -format UDZO "$name.dmg"

    - name: Package deb, rpm, appimage
      if: runner.os == 'Linux'
      run: |
        name=kuterm-${RELEASE_REF#release/}-${{ matrix.name }}
        version=${RELEASE_REF#release/v}
        cargo install --locked cargo-deb cargo-generate-rpm
        cargo deb --no-build --no-strip --target ${{ matrix.target }} --deb-version "$version" -o "$name.deb"
        cargo generate-rpm --target ${{ matrix.target }} --set-metadata "version = \"$version\"" -o "$name.rpm"

        curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
        echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy" | sha256sum -c -
        chmod +x linuxdeploy
        cp assets/logo/icon_256.png kuterm.png
        APPIMAGE_EXTRACT_AND_RUN=1 OUTPUT="$name.AppImage" ./linuxdeploy --appdir AppDir \
          -e target/${{ matrix.target }}/release/kuterm \
          -d assets/kuterm.desktop \
          -i kuterm.png \
          --output appimage

    - uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: |
          kuterm-*.tar.gz
          kuterm-*.zip
          kuterm-*.dmg
          kuterm-*.deb
          kuterm-*.rpm
          kuterm-*.AppImage

  e2e:

    # last check before publishing: the built linux binary driven on a virtual x display
    # and on a headless wayland compositor
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        name: x86_64-linux
        path: dist

    - name: Install podman
      run: command -v podman > /dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends podman)

    - name: Run e2e tests
      run: |
        tar -xzf dist/kuterm-*-x86_64-linux.tar.gz -C dist
        KUTERM_BIN="$(echo dist/kuterm-*-x86_64-linux/kuterm)" sh e2e/run.sh --backend ${{ matrix.backend }}

    # every tested feature with its settings and screenshots, uploaded on failure too
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: e2e-report-${{ matrix.backend }}
        path: e2e/artifacts/report-${{ matrix.backend }}.html

  publish:

    needs: [build, e2e]
    runs-on: ubuntu-26.04

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:

    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true

    - name: Checksums
      run: sha256sum kuterm-* > SHA256SUMS

    - name: Attest build provenance
      id: attest
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: kuterm-*

    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
        BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
      run: |
        cp "$BUNDLE_PATH" "kuterm-${RELEASE_REF#release/}.intoto.jsonl"
        gh release create "${RELEASE_REF#release/}" kuterm-* SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes
