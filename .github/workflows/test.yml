name: Test

on:
  # other branches are tested by their pull request, pushing them too would run everything twice
  push:
    branches: [ "main" ]
    paths-ignore: [ "**.md", "LICENSE" ]
  pull_request:
    paths-ignore: [ "**.md", "LICENSE" ]

# a new commit makes runs for the old one useless
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # only the debug binary, so e2e starts as soon as it is there
  build:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake pkg-config \
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libasound2-dev libssl-dev libzstd-dev

    - uses: Swatinem/rust-cache@v2

    - name: Build
      run: cargo build --verbose

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: kuterm-debug
        path: target/debug/kuterm

  lint:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake pkg-config \
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libasound2-dev libssl-dev libzstd-dev

    - uses: Swatinem/rust-cache@v2

    - name: Add format and lint components
      run: rustup component add rustfmt clippy

    - name: Format
      run: cargo fmt --check

    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings

  # apart from lint, clippy artifacts are of no use to the tests and both run at once
  test:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang cmake pkg-config \
          libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libx11-xcb-dev libxcb1-dev libvulkan-dev \
          libasound2-dev libssl-dev libzstd-dev

    - uses: Swatinem/rust-cache@v2

    - name: Run tests
      shell: bash
      run: cargo test --verbose 2>&1 | tee test-output.txt

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-output
        path: test-output.txt

  # the built binary driven on a virtual x display and on a headless wayland compositor.
  # pull requests only, release branches go through one before release builds run
  e2e:

    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        backend: [x11, wayland]
        # each backend split over three runners, one alone takes over ten minutes
        shard: [1, 2, 3]

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: actions/download-artifact@v8
      with:
        name: kuterm-debug
        path: dist

    - name: Install podman
      run: command -v podman > /dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends podman)

    # runners have 4 vcpus, artifacts lose the executable bit
    - name: Run e2e tests
      env:
        E2E_WORKERS: 3
        E2E_SHARD: ${{ matrix.shard }}/3
      run: |
        chmod +x dist/kuterm
        KUTERM_BIN=dist/kuterm sh e2e/run.sh --backend ${{ matrix.backend }}

    # every tested feature with its settings and screenshots, uploaded on failure too
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: e2e-report-${{ matrix.backend }}-${{ matrix.shard }}
        path: e2e/artifacts/report-${{ matrix.backend }}.html

  # release builds for these too, so platform specific code must compile on pull requests.
  # no -D warnings, unix only features leave dead code on windows
  check:

    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]

    runs-on: ${{ matrix.os }}

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@v2

    - name: Add lint component
      run: rustup component add clippy

    - name: Clippy
      run: cargo clippy --all-targets

  deny:

    runs-on: ubuntu-26.04

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Check advisories, licenses, bans and sources
      uses: EmbarkStudios/cargo-deny-action@v2

  zizmor:

    runs-on: ubuntu-26.04

    permissions:
      contents: read
      security-events: write

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Audit workflows
      uses: zizmorcore/zizmor-action@v0.6.4

  gitleaks:

    runs-on: ubuntu-26.04

    env:
      GITLEAKS_VERSION: 8.30.1

    steps:

    - uses: actions/checkout@v7
      with:
        # scan the whole history, not just the last commit
        fetch-depth: 0
        persist-credentials: false

    - name: Scan for secrets
      run: |
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        curl -fsSLo "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSLo gitleaks_checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks_checksums.txt | sha256sum -c -
        tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
        ./gitleaks git --redact --verbose

  codeql:

    if: github.event_name == 'push'
    runs-on: ubuntu-26.04

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:

    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: rust
        build-mode: none

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:rust"
        output: codeql-results

    - name: Upload CodeQL results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: codeql-results
        path: codeql-results
